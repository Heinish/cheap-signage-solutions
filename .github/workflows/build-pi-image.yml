name: Build Pi signage image

on:
  workflow_dispatch:
    inputs:
      pi_gen_ref:
        description: "pi-gen git ref to build against"
        default: "bookworm"
        required: false
  push:
    tags:
      - "image-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          sudo docker image prune -af

      - name: Enable arm64 emulation
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static binfmt-support

      - name: Build image
        working-directory: image-builder
        run: ./build.sh "${{ github.event.inputs.pi_gen_ref || 'bookworm' }}"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: css-signage-image
          path: image-builder/output/*.img.xz
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/image-v')
        uses: softprops/action-gh-release@v2
        with:
          files: image-builder/output/*.img.xz
