<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>CSS Signage - Offline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        [class*="goog-"],
        [id*="goog-"],
        [class*="translate"],
        [id*="translate"],
        .goog-te-banner-frame,
        .goog-te-menu-frame,
        body > div[style*="translate"] {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        :root {
            --bg: #0a0c0f;
            --text-primary: #e9ebee;
            --text-secondary: #9aa1ac;
            --text-tertiary: #5f6672;
            --status-offline: #e35d5d;
            --status-offline-dim: rgba(227, 93, 93, 0.14);
            --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            background-image:
                radial-gradient(ellipse 1100px 600px at 85% -10%, rgba(227, 93, 93, 0.06), transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: auto, 48px 48px, 48px 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            text-align: center;
            max-width: 640px;
            padding: 40px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 48px;
        }

        .brand-mark {
            width: 40px;
            height: 40px;
            border-radius: 9px;
            background: linear-gradient(155deg, #6b7280, #4b5563 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 17px;
            color: #0d0f13;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 16px 6px 12px;
            border-radius: 999px;
            background: var(--status-offline-dim);
            color: var(--status-offline);
            margin-bottom: 28px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse-dot 1.8s infinite;
        }

        @keyframes pulse-dot {
            0% { box-shadow: 0 0 0 0 rgba(227, 93, 93, 0.5); }
            70% { box-shadow: 0 0 0 8px rgba(227, 93, 93, 0); }
            100% { box-shadow: 0 0 0 0 rgba(227, 93, 93, 0); }
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 14px;
            letter-spacing: -0.01em;
        }

        .message {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .reconnect-info {
            font-size: 13px;
            color: var(--text-tertiary);
            margin-top: 28px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">
            <div class="brand-mark">CS</div>
            <div class="brand-name">CSS Signage</div>
        </div>

        <div class="status-pill">
            <span class="status-dot"></span>
            Network offline
        </div>

        <h1>Connection lost</h1>
        <div class="message">Please check the network connection for this display.</div>
        <div class="message">It will resume automatically once the connection is restored.</div>

        <div class="reconnect-info">Checking every 10 seconds…</div>
    </div>

    <script>
        setInterval(() => {
            fetch('http://localhost:5000/api/health')
                .then(() => location.reload())
                .catch(() => console.log('Still offline, retrying...'));
        }, 10000);
    </script>
</body>
</html>
