<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>CSS Signage - Add to Dashboard</title>
    <style>
        /* Force hide all translate UI elements */
        [class*="goog-"],
        [id*="goog-"],
        [class*="translate"],
        [id*="translate"],
        .goog-te-banner-frame,
        .goog-te-menu-frame,
        body > div[style*="translate"] {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 40px;
        }

        .logo {
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 56px;
            margin-bottom: 40px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            line-height: 1.4;
        }

        .ip-box {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 40px;
            margin: 50px auto;
            max-width: 600px;
            backdrop-filter: blur(10px);
        }

        .ip-address {
            font-size: 64px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        .loading {
            font-size: 32px;
            opacity: 0.8;
        }

        .subtitle {
            font-size: 22px;
            opacity: 0.85;
            margin-top: 12px;
        }

        .ip-footer {
            margin-top: 30px;
            font-size: 18px;
            opacity: 0.6;
            font-family: 'Courier New', monospace;
        }
    </style>
    <script>
        async function refresh() {
            const codeEl = document.getElementById('pairing-code');
            const subtitleEl = document.getElementById('subtitle');
            const ipEl = document.getElementById('ip-footer');

            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                const ms = data.mainserver || {};

                if (data.ip_address) {
                    ipEl.textContent = 'IP: ' + data.ip_address;
                }

                if (ms.mainserver_status === 'pairing' && ms.pairing_code) {
                    codeEl.textContent = ms.pairing_code;
                    codeEl.classList.remove('loading');
                    subtitleEl.textContent = 'Enter this code in the CSS dashboard to add this display';
                } else if (ms.mainserver_status === 'connected') {
                    codeEl.textContent = 'Connected';
                    codeEl.classList.remove('loading');
                    subtitleEl.textContent = 'Waiting for a URL to be set from the dashboard';
                } else if (ms.mainserver_status === 'connecting') {
                    codeEl.textContent = 'Connecting...';
                    subtitleEl.textContent = 'Reaching the mainserver';
                } else {
                    codeEl.textContent = 'Not configured';
                    subtitleEl.textContent = 'No mainserver URL set on this device yet';
                }
            } catch (error) {
                codeEl.textContent = 'Unable to reach agent';
            }
        }

        window.addEventListener('load', refresh);
        setInterval(refresh, 3000);
    </script>
</head>
<body>
    <div class="container">
        <div class="logo">CSS</div>
        <h1>Add to Dashboard</h1>

        <div class="ip-box pulse">
            <div id="pairing-code" class="ip-address loading">Loading...</div>
        </div>
        <div id="subtitle" class="subtitle"></div>
        <div id="ip-footer" class="ip-footer"></div>
    </div>
</body>
</html>
